[profile.default]
src = "src"
out = "out"
libs = ["lib"]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

optimizer = true
optimizer_runs = 200
via_ir = true

remappings = [
    "forge-std/=lib/forge-std/src/",
    "base-std/=lib/base-std/src/",
]

# Allow the deploy script to read the test-wallet key file one level up.
# The key is never printed or committed; see script/Deploy.s.sol.
fs_permissions = [{ access = "read", path = "../agent-wallet.json" }]

base = true
